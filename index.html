<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathematical Flower</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Intro overlay -->
  <div id="intro" class="intro">
    <div class="intro-content">
      <div class="intro-equation" id="intro-equation"></div>
      <div class="intro-subtitle" id="intro-subtitle">Loading mathematics...</div>
    </div>
  </div>

  <!-- Main content -->
  <div id="main-content" class="main-content hidden">
    <!-- Flower container -->
    <div class="flower-stage" id="flower-stage">
      <svg id="flower-svg" viewBox="-10 -10 20 20" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- Petal gradients -->
          <radialGradient id="petal-gradient-0" cx="50%" cy="100%" r="80%">
            <stop offset="0%" stop-color="#e8739e"/>
            <stop offset="50%" stop-color="#f4a0b8"/>
            <stop offset="100%" stop-color="#f7c4d4"/>
          </radialGradient>
          <radialGradient id="petal-gradient-1" cx="45%" cy="100%" r="80%">
            <stop offset="0%" stop-color="#e06898"/>
            <stop offset="50%" stop-color="#f09ab0"/>
            <stop offset="100%" stop-color="#f5bccf"/>
          </radialGradient>
          <radialGradient id="petal-gradient-2" cx="55%" cy="100%" r="80%">
            <stop offset="0%" stop-color="#e8709c"/>
            <stop offset="50%" stop-color="#f2a0b6"/>
            <stop offset="100%" stop-color="#f8c8d6"/>
          </radialGradient>
          <radialGradient id="petal-gradient-3" cx="48%" cy="100%" r="80%">
            <stop offset="0%" stop-color="#e46a96"/>
            <stop offset="50%" stop-color="#f098ae"/>
            <stop offset="100%" stop-color="#f6c0d0"/>
          </radialGradient>
          <radialGradient id="petal-gradient-4" cx="52%" cy="100%" r="80%">
            <stop offset="0%" stop-color="#e6729c"/>
            <stop offset="50%" stop-color="#f19eb4"/>
            <stop offset="100%" stop-color="#f7c6d4"/>
          </radialGradient>
          <!-- Glow filter -->
          <filter id="petal-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="0.15" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <filter id="center-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="0.08" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <!-- Petal groups will be inserted here by JS -->
        <g id="petals-layer"></g>
        <g id="veins-layer"></g>
        <g id="center-layer"></g>
        <g id="filaments-layer"></g>
        <g id="anthers-layer"></g>
      </svg>
    </div>

    <!-- Romantic message -->
    <div class="romantic-message hidden" id="romantic-message">
      <p class="message-line" id="msg-line-1">Some flowers are picked.</p>
      <p class="message-line" id="msg-line-2">This one was calculated.</p>
      <p class="message-line delay-1" id="msg-line-3">Every curve,</p>
      <p class="message-line delay-2" id="msg-line-4">every petal,</p>
      <p class="message-line delay-3" id="msg-line-5">every little detail</p>
      <p class="message-line delay-4" id="msg-line-6">was written for you.</p>
      <p class="message-line delay-5" id="msg-line-7">Because even mathematics</p>
      <p class="message-line delay-6" id="msg-line-8">can be beautiful</p>
      <p class="message-line delay-7" id="msg-line-9">when it's for you.</p>
    </div>

    <!-- Equations panel -->
    <div class="equations-panel hidden" id="equations-panel">
      <h2>The Mathematics</h2>
      <div id="equations-content"></div>
    </div>

    <!-- Explore button -->
    <div class="explore-btn-wrap hidden" id="explore-btn-wrap">
      <button class="explore-btn" id="explore-btn">See how I made it</button>
    </div>

    <!-- Interactive controls -->
    <div class="controls-panel hidden" id="controls-panel">
      <h2>Explore the Mathematics</h2>
      <div class="control-group">
        <label>Petal Size <span id="val-size">1.0</span></label>
        <input type="range" id="ctrl-size" min="0.5" max="2.0" step="0.05" value="1.0">
      </div>
      <div class="control-group">
        <label>Petal Width <span id="val-width">1.0</span></label>
        <input type="range" id="ctrl-width" min="0.4" max="1.8" step="0.05" value="1.0">
      </div>
      <div class="control-group">
        <label>Curvature <span id="val-curvature">1.0</span></label>
        <input type="range" id="ctrl-curvature" min="0.2" max="2.0" step="0.05" value="1.0">
      </div>
      <div class="control-group">
        <label>Asymmetry <span id="val-asymmetry">1.0</span></label>
        <input type="range" id="ctrl-asymmetry" min="0" max="2.0" step="0.05" value="1.0">
      </div>
      <div class="control-group">
        <label>Flower Radius <span id="val-radius">1.0</span></label>
        <input type="range" id="ctrl-radius" min="0.5" max="1.8" step="0.05" value="1.0">
      </div>
      <div class="control-group">
        <label>Number of Petals <span id="val-petals">5</span></label>
        <input type="range" id="ctrl-petals" min="3" max="8" step="1" value="5">
      </div>
      <div class="control-group">
        <label>Stamen Length <span id="val-stamen">1.0</span></label>
        <input type="range" id="ctrl-stamen" min="0.3" max="2.0" step="0.05" value="1.0">
      </div>
      <button class="reset-btn" id="reset-btn">Reset to Original</button>
    </div>

    <!-- Footer -->
    <div class="footer hidden" id="footer">
      <p>Generated entirely through mathematics &amp; code</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
