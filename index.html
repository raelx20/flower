<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>For Anu — A Mathematical Love Letter</title>
  <meta name="description" content="Out of all possible coordinates, somehow I found you.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====== SVG STAGE (flower, heart, moon, grid, points) ====== -->
  <div class="stage" id="stage">
    <svg id="scene-svg" viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs id="scene-defs">
        <!-- Petal gradients: dark at the flower centre, luminous at the tips
             (userSpaceOnUse so every petal shades the same way) -->
        <radialGradient id="petal-gradient-0" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="66">
          <stop offset="0%" stop-color="#5E1636"/>
          <stop offset="40%" stop-color="#8F2858"/>
          <stop offset="75%" stop-color="#D63384"/>
          <stop offset="100%" stop-color="#FF8FC4"/>
        </radialGradient>
        <radialGradient id="petal-gradient-1" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="66">
          <stop offset="0%" stop-color="#5E1636"/>
          <stop offset="42%" stop-color="#8F2858"/>
          <stop offset="76%" stop-color="#E83E8C"/>
          <stop offset="100%" stop-color="#FFD1E5"/>
        </radialGradient>
        <radialGradient id="petal-gradient-2" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="66">
          <stop offset="0%" stop-color="#5E1636"/>
          <stop offset="38%" stop-color="#8F2858"/>
          <stop offset="74%" stop-color="#D63384"/>
          <stop offset="100%" stop-color="#FF8FC4"/>
        </radialGradient>
        <radialGradient id="petal-gradient-3" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="66">
          <stop offset="0%" stop-color="#5E1636"/>
          <stop offset="41%" stop-color="#8F2858"/>
          <stop offset="75%" stop-color="#E83E8C"/>
          <stop offset="100%" stop-color="#FFD1E5"/>
        </radialGradient>
        <radialGradient id="petal-gradient-4" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="66">
          <stop offset="0%" stop-color="#5E1636"/>
          <stop offset="39%" stop-color="#8F2858"/>
          <stop offset="76%" stop-color="#D63384"/>
          <stop offset="100%" stop-color="#FF8FC4"/>
        </radialGradient>

        <!-- Heart fill -->
        <linearGradient id="heart-fill-gradient" x1="0" y1="-90" x2="0" y2="90" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#E83E8C" stop-opacity="0.34"/>
          <stop offset="55%" stop-color="#D63384" stop-opacity="0.20"/>
          <stop offset="100%" stop-color="#8F2858" stop-opacity="0.10"/>
        </linearGradient>

        <!-- Moon -->
        <radialGradient id="moon-gradient" cx="38%" cy="34%" r="75%">
          <stop offset="0%" stop-color="#FFF7FB"/>
          <stop offset="55%" stop-color="#FFD1E5"/>
          <stop offset="100%" stop-color="#FF8FC4"/>
        </radialGradient>
        <radialGradient id="moon-halo-gradient" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FF8FC4" stop-opacity="0.35"/>
          <stop offset="60%" stop-color="#E83E8C" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#E83E8C" stop-opacity="0"/>
        </radialGradient>

        <!-- Glow filters -->
        <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="1.6" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="petal-glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="0.5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="cursor-glow" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="1.8" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <g id="layer-grid"></g>
      <g id="layer-morph"></g>
      <g id="layer-flower"></g>
      <g id="layer-heart"></g>
      <g id="layer-moon"></g>
      <g id="layer-particles"></g>
      <g id="layer-point"></g>
    </svg>
  </div>

  <!-- ====== HTML OVERLAY ====== -->
  <div class="overlay" id="overlay">

    <!-- Scene text lines are appended here by POETRY.showLine() -->
    <div class="text-layer" id="text-layer"></div>

    <!-- Mathematical equations for the flower build -->
    <div class="equation-layer" id="equation-layer" aria-hidden="true"></div>

    <!-- Live parameter readout while the heart draws -->
    <div class="param-display" id="param-display" aria-hidden="true"></div>

    <!-- Stanzas (flower poem, heart poem) -->
    <div class="poem-layer" id="poem-layer"></div>

    <!-- ====== PROPOSAL ====== -->
    <section class="proposal hidden" id="proposal">
      <h1 class="proposal-question" id="proposal-question">Will you be mine?</h1>
      <div class="proposal-buttons" id="proposal-buttons">
        <button class="btn btn-yes" id="btn-yes">YES, I WILL &#9825;</button>
        <button class="btn btn-think" id="btn-think">LET ME THINK</button>
      </div>
      <div class="think-panel hidden" id="think-panel">
        <p class="think-line" id="think-line-1"></p>
        <p class="think-line" id="think-line-2"></p>
        <button class="btn btn-ghost hidden" id="btn-back">Back to the question</button>
      </div>
    </section>

    <!-- ====== FINAL SCREEN (after YES) ====== -->
    <section class="final-screen hidden" id="final-screen">
      <div class="final-block" id="final-block-1"></div>
      <div class="final-block" id="final-block-2"></div>
      <div class="final-signature" id="final-signature"></div>
      <div class="final-symbol" id="final-symbol">&#9825;</div>
      <div class="final-actions" id="final-actions">
        <button class="btn btn-ghost" id="btn-replay">Replay</button>
        <button class="btn btn-ghost" id="btn-see-math">See how it was made</button>
      </div>
    </section>
  </div>

  <!-- ====== HUD ====== -->
  <div class="hud" id="hud">
    <button class="hud-btn hidden" id="btn-skip">Skip &rarr;</button>
    <button class="hud-btn music-btn hidden" id="btn-music">Play music &#9837;</button>
  </div>

  <!-- ====== "SEE HOW IT WAS MADE" PANEL ====== -->
  <aside class="math-panel hidden" id="math-panel" role="dialog" aria-label="The mathematics">
    <button class="math-panel-close" id="btn-close-math" aria-label="Close">&times;</button>
    <div class="math-panel-scroll" id="math-panel-content"></div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
